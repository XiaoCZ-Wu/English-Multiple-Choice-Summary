name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile_app/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile_app/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用 Ubuntu 22.04，兼容性更好
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-venv git zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev automake \
          libltdl-dev
          
    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
        
    - name: Cache Buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          mobile_app/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('mobile_app/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
          
    - name: Build APK
      working-directory: mobile_app
      run: |
        # 设置环境变量
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$PATH:$JAVA_HOME/bin
        
        # 显示版本信息
        java -version
        buildozer --version
        
        # 构建 APK（显示详细日志）
        buildozer android debug 2>&1 | tee build.log
        
    - name: Check build output
      if: always()
      working-directory: mobile_app
      run: |
        echo "=== Build directory contents ==="
        ls -la bin/ 2>/dev/null || echo "bin/ directory not found"
        
        echo "=== Build log tail ==="
        tail -100 build.log 2>/dev/null || echo "No build.log found"
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: mobile_app/bin/*.apk
        retention-days: 30
        
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: mobile_app/build.log
        retention-days: 7
